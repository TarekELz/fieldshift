<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="342" viewBox="0 0 1200 342" role="img" aria-labelledby="t d">
  <title id="t">How Field Shift works</title>
  <desc id="d">Three steps: ask the farmer (voice, text or map), compute with five engines on NASA POWER weather and FAO tables, then advise in Egyptian Arabic where code picks the advice and an AI may only reword it.</desc>
  <rect width="1200" height="342" rx="26" fill="#0F1113"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Arabic', 'Segoe UI Arabic', sans-serif"><g transform="translate(56 36)"><rect width="352" height="270" rx="22" fill="#1A1D21" stroke="#2E3338"/><circle cx="50" cy="52" r="22" fill="#62B2EC"/><text x="50" y="60" font-size="24" font-weight="700" fill="#0F1113" text-anchor="middle">1</text><text x="88" y="62" font-size="34" font-weight="700" fill="#ECEDEE">Ask</text><text x="28" y="134" font-size="20" fill="#A3A9AF">Speak, type or tap the map:</text><text x="28" y="166" font-size="20" fill="#A3A9AF">where the field is, what he</text><text x="28" y="198" font-size="20" fill="#A3A9AF">grows, what he wants.</text><rect x="28" y="214" width="296" height="38" rx="12" fill="#23272B"/><text x="44" y="240" font-size="18" fill="#62B2EC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">voice · text · map</text></g><path d="M414 171 h12 m-6 -8 l8 8 l-8 8" fill="none" stroke="#A3A9AF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(432 36)"><rect width="352" height="270" rx="22" fill="#1A1D21" stroke="#2E3338"/><circle cx="50" cy="52" r="22" fill="#E3A33B"/><text x="50" y="60" font-size="24" font-weight="700" fill="#0F1113" text-anchor="middle">2</text><text x="88" y="62" font-size="34" font-weight="700" fill="#ECEDEE">Compute</text><text x="28" y="134" font-size="20" fill="#A3A9AF">Heat, water, salt, season and</text><text x="28" y="166" font-size="20" fill="#A3A9AF">income engines, on the nearest</text><text x="28" y="198" font-size="20" fill="#A3A9AF">of 19 NASA POWER points.</text><rect x="28" y="214" width="296" height="38" rx="12" fill="#23272B"/><text x="44" y="240" font-size="18" fill="#E3A33B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">5 engines · 1990-2025</text></g><path d="M790 171 h12 m-6 -8 l8 8 l-8 8" fill="none" stroke="#A3A9AF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(808 36)"><rect width="352" height="270" rx="22" fill="#1A1D21" stroke="#2E3338"/><circle cx="50" cy="52" r="22" fill="#5DC48A"/><text x="50" y="60" font-size="24" font-weight="700" fill="#0F1113" text-anchor="middle">3</text><text x="88" y="62" font-size="34" font-weight="700" fill="#ECEDEE">Advise</text><text x="28" y="134" font-size="20" fill="#A3A9AF">Code picks the advice. An AI</text><text x="28" y="166" font-size="20" fill="#A3A9AF">may only reword it, keeping</text><text x="28" y="198" font-size="20" fill="#A3A9AF">every number. Egyptian voice.</text><rect x="28" y="214" width="296" height="38" rx="12" fill="#23272B"/><text x="44" y="240" font-size="18" fill="#5DC48A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">do X because Y</text></g></g>
</svg>
