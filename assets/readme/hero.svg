<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Field Shift: Egypt</title>
  <desc id="d">Field Shift is a voice assistant in Egyptian Arabic for Nile Delta farmers, built on NASA POWER weather and FAO tables. The chart shows the project's real result for Gharbia: the later wheat is sown, the more hot days it meets while filling grain, from 4 days for 1 November to 26 days for 25 January.</desc>
  <rect width="1200" height="440" rx="26" fill="#0F1113"/>
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Arabic', 'Segoe UI Arabic', sans-serif">
    <text x="56" y="70" font-size="18" fill="#62B2EC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">NASA SPACE APPS 2026  ·  NILE DELTA, EGYPT</text>
    <text x="56" y="152" font-size="76" font-weight="700" fill="#ECEDEE">Field Shift</text>
    <text x="56" y="204" font-size="30" font-weight="600" fill="#62B2EC">The right crop at the right time.</text>
    <text x="56" y="248" font-size="22" fill="#A3A9AF">A voice assistant in Egyptian Arabic</text>
    <text x="56" y="278" font-size="22" fill="#A3A9AF">for Nile Delta farmers. Built on NASA</text>
    <text x="56" y="308" font-size="22" fill="#A3A9AF">POWER weather and FAO tables.</text>
  </g>
  <g id="verdicts" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Arabic', 'Segoe UI Arabic', sans-serif">
    <g transform="translate(56 342)"><rect width="120" height="64" rx="16" fill="#1A1D21" stroke="#2E3338"/><circle cx="26" cy="32" r="8" fill="#5DC48A"/><text x="102" y="30" font-size="22" font-weight="600" fill="#ECEDEE" text-anchor="end">تمام</text><text x="102" y="52" font-size="18" fill="#A3A9AF" text-anchor="end">Fine</text></g><g transform="translate(190 342)"><rect width="190" height="64" rx="16" fill="#1A1D21" stroke="#2E3338"/><circle cx="26" cy="32" r="8" fill="#E3A33B"/><text x="172" y="30" font-size="22" font-weight="600" fill="#ECEDEE" text-anchor="end">مشكلة بسيطة</text><text x="172" y="52" font-size="18" fill="#A3A9AF" text-anchor="end">A small problem</text></g><g transform="translate(394 342)"><rect width="190" height="64" rx="16" fill="#1A1D21" stroke="#2E3338"/><circle cx="26" cy="32" r="8" fill="#F1776D"/><text x="172" y="30" font-size="22" font-weight="600" fill="#ECEDEE" text-anchor="end">مشكلة كبيرة</text><text x="172" y="52" font-size="18" fill="#A3A9AF" text-anchor="end">A big problem</text></g>
  </g>
  <g id="project-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Arabic', 'Segoe UI Arabic', sans-serif">
    <rect x="600" y="36" width="544" height="368" rx="22" fill="#1A1D21" stroke="#2E3338"/>
    <text x="624" y="76" font-size="22" font-weight="700" fill="#ECEDEE">Wheat sown later meets more heat</text>
    <text x="624" y="104" font-size="18" fill="#A3A9AF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hot days (&gt;32 °C) in grain filling</text>
    <text x="624" y="130" font-size="18" fill="#A3A9AF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Gharbia · NASA POWER · median of 36 seasons</text>
    <line x1="624" y1="348" x2="1120" y2="348" stroke="#2E3338" stroke-width="2"/>
    <rect x="624.0" y="321.8" width="27.1" height="26.2" rx="4" fill="#5DC48A"/><rect x="657.1" y="302.2" width="27.1" height="45.8" rx="4" fill="#5DC48A"/><rect x="690.1" y="302.2" width="27.1" height="45.8" rx="4" fill="#5DC48A"/><rect x="723.2" y="282.6" width="27.1" height="65.4" rx="4" fill="#5DC48A"/><rect x="756.3" y="276.1" width="27.1" height="71.9" rx="4" fill="#E3A33B"/><rect x="789.3" y="263.0" width="27.1" height="85.0" rx="4" fill="#E3A33B"/><rect x="822.4" y="249.9" width="27.1" height="98.1" rx="4" fill="#F1776D"/><rect x="855.5" y="236.8" width="27.1" height="111.2" rx="4" fill="#F1776D"/><rect x="888.5" y="223.8" width="27.1" height="124.2" rx="4" fill="#F1776D"/><rect x="921.6" y="210.7" width="27.1" height="137.3" rx="4" fill="#F1776D"/><rect x="954.7" y="210.7" width="27.1" height="137.3" rx="4" fill="#F1776D"/><rect x="987.7" y="197.6" width="27.1" height="150.4" rx="4" fill="#F1776D"/><rect x="1020.8" y="184.5" width="27.1" height="163.5" rx="4" fill="#F1776D"/><rect x="1053.9" y="184.5" width="27.1" height="163.5" rx="4" fill="#F1776D"/><rect x="1086.9" y="178.0" width="27.1" height="170.0" rx="4" fill="#F1776D"/>
    <text x="637.5" y="313.8" font-size="22" font-weight="700" fill="#ECEDEE" text-anchor="middle">4</text><text x="703.7" y="294.2" font-size="22" font-weight="700" fill="#ECEDEE" text-anchor="middle">7</text><text x="1100.5" y="170.0" font-size="22" font-weight="700" fill="#ECEDEE" text-anchor="middle">26</text>
    <text x="624.0" y="378" font-size="18" fill="#A3A9AF" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1 Nov</text><text x="802.9" y="378" font-size="18" fill="#A3A9AF" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1 Dec</text><text x="968.2" y="378" font-size="18" fill="#A3A9AF" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1 Jan</text><text x="1114.0" y="378" font-size="18" fill="#A3A9AF" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">25 Jan</text>
  </g>
</svg>
