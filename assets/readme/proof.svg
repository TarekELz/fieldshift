<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="212" viewBox="0 0 1200 212" role="img" aria-labelledby="t d">
  <title id="t">What is inside the project</title>
  <desc id="d">19 NASA POWER data points, 36 seasons of weather, 14 crops, 103 recorded voice lines.</desc>
  <rect width="1200" height="212" rx="26" fill="#0F1113"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans Arabic', 'Segoe UI Arabic', sans-serif"><g transform="translate(56 40)"><text x="0" y="62" font-size="64" font-weight="700" fill="#62B2EC">19</text><text x="0" y="104" font-size="22" font-weight="600" fill="#ECEDEE">NASA POWER points</text><text x="0" y="134" font-size="18" fill="#A3A9AF">7 places, 12 more cells</text></g><g transform="translate(336 40)"><text x="0" y="62" font-size="64" font-weight="700" fill="#62B2EC">36</text><text x="0" y="104" font-size="22" font-weight="600" fill="#ECEDEE">seasons of weather</text><text x="0" y="134" font-size="18" fill="#A3A9AF">1990 to 2025, daily</text></g><line x1="312" y1="48" x2="312" y2="172" stroke="#2E3338" stroke-width="2"/><g transform="translate(616 40)"><text x="0" y="62" font-size="64" font-weight="700" fill="#62B2EC">14</text><text x="0" y="104" font-size="22" font-weight="600" fill="#ECEDEE">crops with income</text><text x="0" y="134" font-size="18" fill="#A3A9AF">FAOSTAT and FAO tables</text></g><line x1="592" y1="48" x2="592" y2="172" stroke="#2E3338" stroke-width="2"/><g transform="translate(896 40)"><text x="0" y="62" font-size="64" font-weight="700" fill="#62B2EC">103</text><text x="0" y="104" font-size="22" font-weight="600" fill="#ECEDEE">recorded voice lines</text><text x="0" y="134" font-size="18" fill="#A3A9AF">they work offline</text></g><line x1="872" y1="48" x2="872" y2="172" stroke="#2E3338" stroke-width="2"/></g>
</svg>
