# Memory kept low on purpose: the default (8 GB) crashed the build on a 16 GB laptop with many apps open.
# Raise these if you have spare RAM.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
