name: Pages
# Publishes the project page and the explorer website (docs/) on GitHub Pages. Static files only: no build step, no API keys.
# Turn on in the repository: Settings > Pages > Source: GitHub Actions. Needs the repository to be public (or a plan that allows Pages on private repositories).
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          mkdir -p _site/assets
          cp -r assets/readme _site/assets/
          # a key file must never be published
          test -z "$(find _site -name 'secrets.json' -o -name '.env' | head -1)"
          ! grep -rIl 'AIza[0-9A-Za-z_-]\{20,\}' _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
