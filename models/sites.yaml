# Main Nile Delta areas used for data pulls and demo examples.
# The engines can run anywhere in the Delta; these are example points, matched to where
# the literature studied farmers (see docs/data_plan.md). Coordinates are approximate farm
# locations chosen off towns; "cropland_check" is filled by scripts from MODIS NDVI.
sites:
  kafr_el_sheikh:
    name_en: Kafr El-Sheikh (north Delta)
    lat: 31.10
    lon: 30.91
    why: rice-wheat-berseem belt; salinity in the north; Sakha research station
    evidence: [kassem2019, elbasyoni2018]
  damietta:
    name_en: Damietta (north-east Delta)
    lat: 31.35
    lon: 31.75
    why: saline coastal land; teammate's NDVI point damietta3
    caveat_kind: sea
    weather_caveat: NASA POWER cell is mostly sea (July Tmax about 30 C, zero heat days at every sowing date). Do not use for heat claims or show as low risk.
    evidence: [hagage2024]
  beheira:
    name_en: El-Beheira (west Delta)
    lat: 30.94
    lon: 30.15
    why: canal tail-end water shortage; drainage water reuse
    evidence: [ghazouani2014, kassem2019, hautbout2025]
  gharbia:
    name_en: Gharbia (central Delta, near Tanta)
    lat: 30.86
    lon: 31.05
    why: old lands; original pilot area, moved off Tanta city
    evidence: [attaher2009]
  menoufia:
    name_en: Menoufia (south Delta)
    lat: 30.54
    lon: 30.95
    why: small old-land holdings
    caveat_kind: shared_cell
    shares_cell_with: sharqia
    weather_caveat: same NASA POWER cell as Sharqia, so weather and results are identical; show as one area in the demo.
    evidence: []
  sharqia:
    name_en: Sharqia (east Delta, Zankalon area)
    lat: 30.49
    lon: 31.43
    why: remote-sensing water productivity study area
    caveat_kind: shared_cell
    shares_cell_with: menoufia
    weather_caveat: same NASA POWER cell as Menoufia, so weather and results are identical; show as one area in the demo.
    evidence: [ayyad2024]
  dakahlia:
    name_en: Dakahlia (east Delta, Dikirnis area)
    lat: 31.05
    lon: 31.70
    why: "added 2026-11-15 so Dakahlia has its own NASA POWER cell. The governorate's west side, including Mansoura city (31.04N 31.38E), lies in the SAME POWER cell as Gharbia (checked: all 366 daily Tmax values of 2020 identical), so Mansoura uses the Gharbia data; this point is in the next cell east (365 of 366 days differ from Gharbia)"
    evidence: []
